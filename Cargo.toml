[package]
name = "spacy_rs"
version = "0.1.0"
authors = ["Douglas Luman <dluman@douglasjluman.com>"]
edition = "2021"

[dependencies]
pyo3 = { version = "0.21", features = ["abi3-py38", "auto-initialize"] }
numpy = "0.21"
